<app-navbar></app-navbar>

<app-login *ngIf="!apiService.obtenerToken()" (loginExitoso)="onLoginExitoso()"></app-login>

<main *ngIf="apiService.obtenerToken()" class="container-xxl py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h4 class="mb-0"><i class="bi bi-speedometer2 me-2 text-primary"></i>Panel de administración</h4>
    <span class="badge text-bg-success">JWT ACTIVO · {{ rol }}</span>
  </div>

  <app-alumnos *ngIf="verAlumnos"></app-alumnos>
  <app-cursos *ngIf="verCursos"></app-cursos>
  <app-personal *ngIf="verPersonal"></app-personal>

  <div *ngIf="!tieneModulos" class="alert alert-light text-center">Su perfil no tiene módulos habilitados.</div>
</main>
