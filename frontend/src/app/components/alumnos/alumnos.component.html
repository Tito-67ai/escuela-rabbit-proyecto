<div class="card mb-4" *ngIf="puedeGestionar">
  <div class="card-body">
    <h5 class="section-title">
      <i class="bi bi-person-plus"></i>
      {{ modoEdicion ? 'Editar Alumno' : 'Registrar Alumno' }}
    </h5>

    <div class="row g-2">
      <div class="col-12 col-sm-6 col-md-3">
        <input type="text" [(ngModel)]="nombre" placeholder="Nombre" class="form-control">
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <input type="text" [(ngModel)]="apellido" placeholder="Apellido" class="form-control">
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <input type="text" [(ngModel)]="dni" placeholder="Documento" class="form-control">
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <select [(ngModel)]="cursoId" class="form-select">
          <option [ngValue]="null" disabled selected>Seleccione Curso</option>
          <option *ngFor="let c of cursos" [value]="c.id">{{ c.nombre }}</option>
        </select>
      </div>
    </div>

    <div class="mt-3 d-flex flex-wrap gap-2">
      <button (click)="guardarAlumno()" class="btn btn-primary">
        {{ modoEdicion ? 'Guardar Cambios' : 'Registrar Alumno' }}
      </button>
      <button *ngIf="modoEdicion" (click)="limpiarFormulario()" class="btn btn-outline-secondary">Cancelar</button>
    </div>
  </div>
</div>

<div class="card mb-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">Alumnos Registrados</h5>
      <span class="badge text-bg-light">{{ alumnos.length }}</span>
    </div>

    <div class="table-responsive" *ngIf="alumnos.length > 0">
      <table class="table align-middle mt-2 mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Documento</th>
            <th>Curso</th>
            <th class="text-center" *ngIf="puedeGestionar">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let a of alumnos">
            <td>{{ a.id }}</td>
            <td>{{ a.nombre }}</td>
            <td>{{ a.apellido }}</td>
            <td>{{ a.dni }}</td>
            <td>{{ nombreCurso(a.cursoId) }}</td>
            <td class="text-center" *ngIf="puedeGestionar">
              <div class="d-flex justify-content-center gap-1">
                <button (click)="seleccionarParaEditar(a)" class="btn btn-outline-warning btn-sm">Editar</button>
                <button (click)="eliminarAlumno(a.id)" class="btn btn-outline-danger btn-sm">Eliminar</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="alumnos.length === 0" class="alert alert-light text-center mt-2 mb-0">No hay alumnos registrados.</div>
  </div>
</div>
