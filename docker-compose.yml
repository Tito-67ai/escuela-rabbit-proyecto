# Docker Compose propio del proyecto Escuela (backend + RabbitMQ).
#
# Levanta toda la infraestructura y los microservicios en una red interna.
# El frontend NO se incluye aca: se corre aparte con `ng serve` (o su propio Dockerfile).
#
# Orden de arranque: rabbitmq + eureka -> config-server -> microservicios -> gateway.
# Los servicios esperan a que eureka/config-server esten "healthy" antes de iniciar.
#
# Notas importantes para que funcione dentro de Docker:
#  - Cada servicio arranca con el perfil `docker` (SPRING_PROFILES_ACTIVE=docker), definido
#    DENTRO de su propio jar (application.yml + application-docker.yml). Ese perfil apunta la
#    configuracion al contenedor config-server y el registro Eureka a eureka-server.
#  - La config de rabbit (rama `config`) usa host=localhost. Se sobreescribe con SPRING_RABBITMQ_HOST=rabbitmq.
#  - El gateway arma sus rutas con `lb://nombre-servicio` (descubrimiento via Eureka).
#  - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true hace que los servicios (y el Feign entre ellos)
#    se ubiquen por IP de contenedor en vez de por hostname no resoluble.

services:

  # ---------------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Consola web (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - escuela-network

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped
    networks:
      - escuela-network

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: "docker"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://configuser:configpass123@127.0.0.1:8888/application/default\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 45s
    restart: unless-stopped
    networks:
      - escuela-network

  # ---------------------------------------------------------------------------
  # Microservicios de negocio
  # ---------------------------------------------------------------------------

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8084:8084"
    environment: &service-env
      SPRING_PROFILES_ACTIVE: "docker"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  admin-service:
    build: ./admin-service
    container_name: admin-service
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  alumno-service:
    build: ./alumno-service
    container_name: alumno-service
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      SPRING_RABBITMQ_HOST: "rabbitmq"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  curso-service:
    build: ./curso-service
    container_name: curso-service
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
      SPRING_RABBITMQ_HOST: "rabbitmq"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  # ---------------------------------------------------------------------------
  # Monitoreo (Spring Boot Admin)
  # ---------------------------------------------------------------------------

  admin-server:
    build: ./admin-server
    container_name: admin-server
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: "docker"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

networks:
  escuela-network:
    driver: bridge
