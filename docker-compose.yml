# Docker Compose del proyecto COMPLETO (backend + RabbitMQ + frontend).
#
# Un solo comando, desde la raiz del repo:
#
#     docker compose up -d --build
#
# Servicios: rabbitmq, eureka-server, config-server, auth, admin, alumno, curso,
# gateway-service, admin-server y frontend.
#
#   Frontend (Angular servido con Nginx): http://localhost:4200
#   API (a traves del gateway):           http://localhost:8080
#   Spring Boot Admin (monitoreo):        http://localhost:8090
#   Consola RabbitMQ (guest/guest):       http://localhost:15672
#
# Cada microservicio arranca con el perfil `docker` (SPRING_PROFILES_ACTIVE=docker).
# Ese perfil viene definido DENTRO del propio jar (application.yml + application-docker.yml)
# y apunta la configuracion al contenedor `config-server` y el registro Eureka a
# `eureka-server`. Por eso ya no hace falta sobreescribir URIs por variables de entorno.
#
#  - La config de rabbit (repo escuela-config) usa host=localhost; se sobreescribe
#    con SPRING_RABBITMQ_HOST=rabbitmq.
#  - El gateway arma sus rutas con `lb://nombre-servicio` (descubrimiento via Eureka).
#  - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true hace que los servicios (y el Feign
#    entre ellos) se ubiquen por IP de contenedor.

services:

  # ---------------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Consola web (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 45s
    restart: unless-stopped
    networks:
      - escuela-network

  eureka-server:
    build: ./backend/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:8761/\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 45s
    restart: unless-stopped
    networks:
      - escuela-network

  config-server:
    build: ./backend/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: "docker"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://configuser:configpass123@127.0.0.1:8888/application/default\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 45s
    restart: unless-stopped
    networks:
      - escuela-network

  # ---------------------------------------------------------------------------
  # Microservicios de negocio
  # ---------------------------------------------------------------------------

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    ports:
      - "8084:8084"
    environment: &service-env
      SPRING_PROFILES_ACTIVE: "docker"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  admin-service:
    build: ./backend/admin-service
    container_name: admin-service
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  alumno-service:
    build: ./backend/alumno-service
    container_name: alumno-service
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      SPRING_RABBITMQ_HOST: "rabbitmq"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  curso-service:
    build: ./backend/curso-service
    container_name: curso-service
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
      SPRING_RABBITMQ_HOST: "rabbitmq"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  gateway-service:
    build: ./backend/gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  # ---------------------------------------------------------------------------
  # Monitoreo (Spring Boot Admin)
  # ---------------------------------------------------------------------------

  admin-server:
    build: ./backend/admin-server
    container_name: admin-server
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: "docker"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  # ---------------------------------------------------------------------------
  # Frontend (Angular servido con Nginx)
  # ---------------------------------------------------------------------------

  frontend:
    build: ./frontend
    container_name: frontend-escuela
    ports:
      - "4200:80"
    depends_on:
      - gateway-service
    restart: unless-stopped
    networks:
      - escuela-network

networks:
  escuela-network:
    driver: bridge
