# Docker Compose del proyecto COMPLETO (backend + RabbitMQ + frontend).
#
# Un solo comando, desde la raiz del repo:
#
#     docker compose up -d --build
#
# Servicios: rabbitmq, eureka-server, config-server, auth, admin, alumno, curso,
# gateway-service y frontend.
#
#   Frontend (Angular servido con Nginx): http://localhost:4200
#   API (a traves del gateway):           http://localhost:8080
#
# Detalles para que funcione dentro de Docker:
#  - Los servicios usan `spring.config.import=optional:configserver:` con
#    `spring.cloud.config.uri=http://localhost:8888/`. Aca se sobreescribe el uri
#    con SPRING_CLOUD_CONFIG_URI apuntando al contenedor config-server.
#  - La config de rabbit (repo escuela-config) usa host=localhost; se sobreescribe
#    con SPRING_RABBITMQ_HOST=rabbitmq.
#  - El gateway tiene rutas fijas a localhost:808x; se sobreescriben por variables
#    de entorno apuntando a los nombres de contenedor.
#  - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true hace que los servicios (y el Feign
#    entre ellos) se ubiquen por IP de contenedor.

services:

  # ---------------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Consola web (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 45s
    restart: unless-stopped
    networks:
      - escuela-network

  eureka-server:
    build: ./backend/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:8761/\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 45s
    restart: unless-stopped
    networks:
      - escuela-network

  config-server:
    build: ./backend/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://configuser:configpass123@127.0.0.1:8888/application/default\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 45s
    restart: unless-stopped
    networks:
      - escuela-network

  # ---------------------------------------------------------------------------
  # Microservicios de negocio
  # ---------------------------------------------------------------------------

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    ports:
      - "8084:8084"
    environment: &service-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_CLOUD_CONFIG_URI: "http://config-server:8888/"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  admin-service:
    build: ./backend/admin-service
    container_name: admin-service
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  alumno-service:
    build: ./backend/alumno-service
    container_name: alumno-service
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  curso-service:
    build: ./backend/curso-service
    container_name: curso-service
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  gateway-service:
    build: ./backend/gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
      # Rutas del gateway apuntando a los contenedores (reemplazan las de localhost).
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: "http://auth-service:8084"
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: "Path=/auth/**"
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: admin-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: "http://admin-service:8083"
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: "Path=/auth-admin/**"
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_1: "Path=/admin/**"
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: alumno-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: "http://alumno-service:8081"
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: "Path=/alumnos/**"
      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: curso-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: "http://curso-service:8082"
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: "Path=/cursos/**"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - escuela-network

  # ---------------------------------------------------------------------------
  # Frontend (Angular compilado y servido con Nginx)
  # ---------------------------------------------------------------------------

  frontend:
    build: ./frontend
    container_name: frontend-escuela
    ports:
      - "4200:80"
    depends_on:
      - gateway-service
    restart: unless-stopped
    networks:
      - escuela-network

networks:
  escuela-network:
    driver: bridge
