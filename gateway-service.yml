server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        add-to-config-source: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Las rutas usan `lb://` (LoadBalancer): el gateway resuelve cada servicio
        # por su nombre en Eureka, asi funciona igual en local (dev) y en Docker.
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/auth-admin/**, /admin/**

        - id: alumno-service
          uri: lb://alumno-service
          predicates:
            - Path=/alumnos/**

        - id: curso-service
          uri: lb://curso-service
          predicates:
            - Path=/cursos/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
