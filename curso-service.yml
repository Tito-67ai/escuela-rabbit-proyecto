server:
  port: 8082

spring:
  application:
    name: curso-service
  datasource:
    url: jdbc:h2:file:./data/cursodb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  rabbitmq:
    listener:
      simple:
        # Si un mensaje falla no se vuelve a encolar (no se repite)
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
