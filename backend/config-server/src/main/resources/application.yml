server:
  port: 8888

spring:
  application:
    name: config-server
  security:
    user:
      name: configuser
      password: configpass123
  cloud:
    config:
      server:
        git:
          # La config centralizada vive en la rama `config-repo` de este mismo repo.
          uri: https://github.com/Tito-67ai/escuela-rabbit-proyecto.git
          default-label: config-repo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true