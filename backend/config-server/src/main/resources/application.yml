server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    default: dev
  security:
    user:
      name: configuser
      password: configpass123
  cloud:
    config:
      server:
        git:
          # La configuracion centralizada vive en un repositorio aparte:
          #   https://github.com/Tito-67ai/escuela-config
          uri: https://github.com/Tito-67ai/escuela-config.git
          default-label: main

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  instance:
    # Credenciales para que Spring Boot Admin (admin-server) pueda consultar
    # los endpoints de actuator de este servicio (que esta protegido con basic auth).
    metadata-map:
      user.name: configuser
      user.password: configpass123

---
spring:
  config:
    activate:
      on-profile: dev
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
